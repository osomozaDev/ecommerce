name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint y build
    runs-on: ubuntu-latest
    env:
      # CI corre en modo fixtures: determinista, sin red ni secretos.
      COMMERCE_DATA_SOURCE: fixtures
      TENANT_ID: default
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (incluye typecheck)
        run: pnpm build
